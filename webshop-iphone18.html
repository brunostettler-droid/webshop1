<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thai Food Kurier · iPhone 18</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717}
iframe{display:block;width:min(390px,100vw);height:100vh;height:100dvh;margin:auto;border:0;background:#202020}
html.expanded iframe{width:100%;max-width:none}
.screen-controls{position:fixed;right:12px;top:max(10px,env(safe-area-inset-top));z-index:1000;display:flex;gap:8px}
.screen-controls button{font:14px Arial;padding:9px 14px;color:#ead6a2;background:#24211cf0;border:1px solid #8b7046;border-radius:7px;cursor:pointer}
.screen-controls [hidden]{display:none}
</style>
</head>
<body>
<iframe title="Webshop · iPhone 18" src="startseite.html?v=1793354864234279000&amp;format=phone&amp;layout=reference-natural" allow="fullscreen"></iframe>
<nav class="screen-controls" aria-label="Vorschaugrösse">
<button id="open-fullscreen" type="button">⛶ Vollbild</button>
<button id="close-fullscreen" type="button" hidden>← Zurück</button>
</nav>
<script>
(()=>{
const root=document.documentElement,frame=document.querySelector('iframe');
const open=document.getElementById('open-fullscreen'),back=document.getElementById('close-fullscreen');
let expanded=false;
function sync(){
const full=expanded||!!document.fullscreenElement;
root.classList.toggle('expanded',full);
open.hidden=full;back.hidden=!full;open.setAttribute('aria-expanded',String(full));
try{
const doc=frame.contentDocument;
if(doc){
doc.documentElement.classList.toggle('fullscreen-customer',full);
let style=doc.getElementById('phone-fullscreen-fallback');
if(!style){style=doc.createElement('style');style.id='phone-fullscreen-fallback';style.textContent='html.fullscreen-customer body .device-switch{display:none!important}html.fullscreen-customer body.preview-only .workspace .preview-viewport iframe{inset:0!important;top:0!important;width:100%!important;height:100%!important}';doc.head.append(style);}
frame.contentWindow.dispatchEvent(new Event('resize'));
}
}catch(error){}
dispatchEvent(new Event('resize'));
}
open.onclick=()=>{
expanded=true;sync();
if(typeof root.requestFullscreen==='function'){
try{Promise.resolve(root.requestFullscreen()).catch(()=>sync());}catch(error){sync();}
}
};
back.onclick=()=>{
expanded=false;sync();
if(document.fullscreenElement&&typeof document.exitFullscreen==='function'){
try{Promise.resolve(document.exitFullscreen()).catch(()=>sync());}catch(error){sync();}
}
};
document.addEventListener('fullscreenchange',()=>{expanded=!!document.fullscreenElement;sync();});
frame.addEventListener('load',sync);
sync();
})();
</script>
</body>
</html>
