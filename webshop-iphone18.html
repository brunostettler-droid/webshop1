<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Thai Food Kurier"><meta name="theme-color" content="#202020"><title>Thai Food Kurier · iPhone 18 Pro</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#171717}iframe{display:block;width:min(390px,100vw);height:100dvh;margin:auto;border:0;background:#202020}</style><iframe title="Webshop · iPhone 18" src="startseite.html?v=tagespfeile-48px&amp;format=phone&amp;layout=reference-natural"></iframe></html><style>.screen-controls{position:fixed;right:12px;top:10px;z-index:1000;display:flex;gap:8px}.screen-controls button{font:14px Arial;padding:9px 14px;color:#ead6a2;background:#24211cf0;border:1px solid #8b7046;border-radius:7px;cursor:pointer}.screen-controls [hidden]{display:none}html:fullscreen{background:#171717}html:fullscreen iframe{max-width:100vw}html:fullscreen .screen-controls{opacity:.65}html:fullscreen .screen-controls:hover{opacity:1}</style><nav class="screen-controls" aria-label="Vorschaugrösse"><button id="open-fullscreen">⛶ Vollbild</button><button id="close-fullscreen" hidden>⛶ Vollbild beenden</button></nav><style>
html.customer-expanded iframe{width:100vw!important;height:100dvh!important;max-width:none!important}

</style><dialog id="iphone-fullscreen-help"><h2>Vollbild auf dem iPhone</h2><p>Safari blendet die Adressleiste bei diesem Knopf nicht aus.</p><p>Tippe in Safari auf <strong>Teilen</strong> → <strong>Zum Home-Bildschirm</strong>. Öffne den Webshop danach über das neue Symbol – dann erscheint er ohne Safari-Leisten.</p><button type="button">Verstanden</button></dialog>
<script id="iphone-fullscreen-controller">
(()=>{
 const root=document.documentElement,open=document.getElementById('open-fullscreen'),back=document.getElementById('close-fullscreen'),frame=document.querySelector('iframe'),help=document.getElementById('iphone-fullscreen-help');let expanded=false;
 function standalone(){return navigator.standalone===true||matchMedia('(display-mode:standalone)').matches}
 function sync(){const full=expanded||!!document.fullscreenElement||standalone();root.classList.toggle('customer-expanded',full);root.classList.toggle('customer-standalone',standalone());open.hidden=full;back.hidden=!full;back.textContent='← Zurück';try{frame.contentDocument.documentElement.classList.toggle('fullscreen-customer',full)}catch{}dispatchEvent(new Event('resize'));}
 open.onclick=async()=>{window.dispatchEvent(new Event('tfk-preview-original'));expanded=true;sync();if(typeof root.requestFullscreen==='function'){try{await root.requestFullscreen();return}catch{}}if(!standalone())help.showModal();};
 back.onclick=async()=>{expanded=false;if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();sync();};
 help.querySelector('button').onclick=()=>help.close();
 document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)expanded=false;sync()});frame.addEventListener('load',sync);sync();
})();
</script><script id="preview-pinch-zoom">
(()=>{
 const preview=document.querySelector('iframe');let zoom=1,startZoom=1,startDistance=0;
 preview.style.transformOrigin='50% 0';
 const reset=document.createElement('button');reset.textContent='100 %';reset.title='Vorschau auf Originalgrösse zurücksetzen';document.querySelector('.screen-controls').prepend(reset);
 function setZoom(value){zoom=Math.max(.6,Math.min(3,value));preview.style.transform=`scale(${zoom})`;reset.textContent=Math.round(zoom*100)+' %';}
 reset.onclick=()=>setZoom(1);
 window.addEventListener('tfk-preview-original',()=>setZoom(1));
 document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)setZoom(1);});
 const seen=new WeakSet();
 function bind(doc){if(!doc||seen.has(doc))return;seen.add(doc);
 doc.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.008));},{passive:false});
 doc.addEventListener('gesturestart',e=>{e.preventDefault();startZoom=zoom;},{passive:false});
 doc.addEventListener('gesturechange',e=>{e.preventDefault();setZoom(startZoom*e.scale);},{passive:false});
 doc.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
 const distance=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
 doc.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;e.preventDefault();startDistance=distance(e);startZoom=zoom;},{passive:false});
 doc.addEventListener('touchmove',e=>{if(e.touches.length!==2||!startDistance)return;e.preventDefault();setZoom(startZoom*distance(e)/startDistance);},{passive:false});
 doc.addEventListener('touchend',()=>{startDistance=0;});
 function frames(){doc.querySelectorAll('iframe').forEach(f=>{if(!f.dataset.pinchBound){f.dataset.pinchBound='1';f.addEventListener('load',()=>{try{bind(f.contentDocument)}catch{}});}try{bind(f.contentDocument)}catch{}});}
 frames();new MutationObserver(frames).observe(doc.documentElement,{childList:true,subtree:true});
 }
 bind(document);
})();
</script>
