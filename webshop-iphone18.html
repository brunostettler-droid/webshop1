<script id="iphone-fullscreen-controller">
(()=>{
 const root=document.documentElement,open=document.getElementById('open-fullscreen'),back=document.getElementById('close-fullscreen'),frame=document.querySelector('iframe'),help=document.getElementById('iphone-fullscreen-help');let expanded=false;const physicalPhone=matchMedia("(max-width:620px) and (pointer:coarse)");
 function isPhone(){return /iPhone|iPod/i.test(navigator.userAgent)||physicalPhone.matches}
 function standalone(){return navigator.standalone===true||matchMedia('(display-mode:standalone)').matches}
 function sync(){
  const phone=isPhone(), installed=standalone();
  const full=expanded||!!document.fullscreenElement||installed||phone;
  root.classList.toggle('customer-expanded',full);
  root.classList.toggle('customer-standalone',installed);
  root.classList.toggle('customer-phone',phone);open.hidden=full;back.hidden=!full;back.textContent='← Zurück';try{frame.contentDocument.documentElement.classList.toggle('fullscreen-customer',full)}catch{}dispatchEvent(new Event('resize'));}
 open.onclick=async()=>{window.dispatchEvent(new Event('tfk-preview-original'));expanded=true;sync();if(typeof root.requestFullscreen==='function'){try{await root.requestFullscreen();return}catch{}}if(!standalone())help.showModal();};
 back.onclick=async()=>{expanded=false;if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();sync();};
 help.querySelector('button').onclick=()=>help.close();
 document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)expanded=false;sync()});frame.addEventListener('load',sync);physicalPhone.addEventListener('change',sync);sync();
})();
</script><script id="preview-pinch-zoom">
(()=>{
 const preview=document.querySelector('iframe');let zoom=1,startZoom=1,startDistance=0;
 preview.style.transformOrigin='50% 0';
 const reset=document.createElement('button');reset.textContent='100 %';reset.title='Vorschau auf Originalgrösse zurücksetzen';document.querySelector('.screen-controls').prepend(reset);
 function setZoom(value){zoom=Math.max(.6,Math.min(3,value));preview.style.setProperty('--iphone-zoom',zoom);preview.style.transform=`scale(${zoom})`;reset.textContent=Math.round(zoom*100)+' %';}
 reset.onclick=()=>setZoom(1);
 window.addEventListener('tfk-preview-original',()=>setZoom(1));
 document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)setZoom(1);});
 const seen=new WeakSet();
 function bind(doc){if(!doc||seen.has(doc))return;seen.add(doc);
 doc.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();if(!document.documentElement.classList.contains("customer-expanded"))setZoom(zoom*Math.exp(-e.deltaY*.008));},{passive:false});
 doc.addEventListener('gesturestart',e=>{e.preventDefault();startZoom=zoom;},{passive:false});
 doc.addEventListener('gesturechange',e=>{e.preventDefault();if(!document.documentElement.classList.contains("customer-expanded"))setZoom(startZoom*e.scale);},{passive:false});
 doc.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
 const distance=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
 doc.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;e.preventDefault();startDistance=distance(e);startZoom=zoom;},{passive:false});
 doc.addEventListener('touchmove',e=>{if(e.touches.length!==2||!startDistance)return;e.preventDefault();if(!document.documentElement.classList.contains("customer-expanded"))setZoom(startZoom*distance(e)/startDistance);},{passive:false});
 doc.addEventListener('touchend',()=>{startDistance=0;});
 function frames(){doc.querySelectorAll('iframe').forEach(f=>{if(!f.dataset.pinchBound){f.dataset.pinchBound='1';f.addEventListener('load',()=>{try{bind(f.contentDocument)}catch{}});}try{bind(f.contentDocument)}catch{}});}
 frames();new MutationObserver(frames).observe(doc.documentElement,{childList:true,subtree:true});
 }
 bind(document);
})();
</script>

<script id="foodtruck-editor-return">
(()=>{
 const fromEditor=new URLSearchParams(location.search).get('foodtruckEditor')==='1';
 if(location.hostname!=='127.0.0.1'||!fromEditor)return;
 const back=document.getElementById('back-to-foodtruck-editor');
 back.hidden=false;
 back.addEventListener('click',event=>{
  if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
  event.preventDefault();
  window.close();
  // A directly opened preview may not be allowed to close itself.
  setTimeout(()=>location.replace(back.href),150);
 });
})();
</script>
